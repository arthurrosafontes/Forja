<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forja">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Forja</title>
  <script>
    // Aplica o tema salvo antes de desenhar a tela (evita "piscar")
    try {
      var s = JSON.parse(localStorage.getItem('treino-app-v1') || '{}');
      if (s.theme) document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="logoFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a00"/><stop offset="1" stop-color="#ffb347"/></linearGradient></defs>
        <g transform="translate(0 2.5)">
          <path fill="url(#logoFlame)" d="M32 3C36.5 11 45 16 45 28C45 36 39.2 42 32 42C24.8 42 19 36 19 28C19 21.5 22.5 16.5 26 12.5C26.4 18 28.6 21 31 21.8C29.6 14.5 30.2 8.6 32 3Z"/>
          <path fill="#ffe2a8" d="M32 23.5C34.8 27.6 38 29.6 38 34C38 37.4 35.4 40 32 40C28.6 40 26 37.4 26 34C26 30.4 29 28.2 32 23.5Z"/>
        </g>
        <g class="logo-db"><rect x="17" y="46" width="30" height="5" rx="1.5"/><rect x="11" y="39" width="7" height="19" rx="2.2"/><rect x="4.5" y="42.5" width="6" height="12" rx="2"/><rect x="46" y="39" width="7" height="19" rx="2.2"/><rect x="53.5" y="42.5" width="6" height="12" rx="2"/></g>
      </svg>
      <span class="brand-name">Forja</span>
    </div>
    <div class="top-actions">
      <button id="streakBtn" class="streak-pill" data-action="openStreak" aria-label="Ofensiva"></button>
      <button id="themeBtn" class="icon-btn" data-action="toggleTheme" aria-label="Mudar tema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
      </button>
    </div>
  </header>

  <main id="view"></main>

  <div id="timer" class="timer" hidden>
    <div class="timer-bar"><i id="timerFill"></i></div>
    <div class="timer-row">
      <span class="timer-label" id="timerLabel">Descanso</span>
      <b id="timerTime">0:00</b>
      <div class="timer-btns">
        <button data-action="timerAdj" data-d="-15">−15</button>
        <button data-action="timerAdj" data-d="15">+15</button>
        <button data-action="timerStop" aria-label="Parar">✕</button>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <button data-action="tab" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Início</span>
    </button>
    <button data-action="tab" data-tab="plans">
      <svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm3 4v2h8V8Zm0 4v2h8v-2Zm0 4v2h5v-2Z"/></svg>
      <span>Treinos</span>
    </button>
    <button data-action="tab" data-tab="exercises">
      <svg viewBox="0 0 24 24"><path d="M1 10h2V8h2v8H3v-2H1zM6 6h3v12H6zM15 6h3v12h-3zM19 8h2v2h2v4h-2v2h-2zM9 11h6v2H9z"/></svg>
      <span>Exercícios</span>
    </button>
    <button data-action="tab" data-tab="activity">
      <svg viewBox="0 0 24 24"><path d="M4 20h3V10H4zm6 0h3V4h-3zm6 0h3v-7h-3z"/></svg>
      <span>Atividades</span>
    </button>
    <button data-action="tab" data-tab="body">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="4" r="2.5"/><path d="M4 7.5h16v2.2h-5.2V22h-2.2v-6.5h-1.2V22H9.2V9.7H4z"/></svg>
      <span>Corpo</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <input type="file" id="photoFile" accept="image/*" hidden>

  <script src="data.js"></script>
  <script src="figures.js"></script>
  <script src="body.js"></script>
  <script src="core.js"></script>
  <script src="home.js"></script>
  <script src="workout.js"></script>
  <script src="plans.js"></script>
  <script src="exercises.js"></script>
  <script src="activity.js"></script>
  <script src="bodyview.js"></script>
  <script src="profile.js"></script>
</body>
</html>
